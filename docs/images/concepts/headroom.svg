<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" role="img" viewBox="0 0 640 220"><title>Headroom: how much more load a node takes before it runs hot and before it saturates</title><style>.m,.t{fill:#111}.t{font-family:&apos;Archivo&apos;,system-ui,-apple-system,&apos;Segoe UI&apos;,sans-serif}.m{font-family:&apos;JetBrains Mono&apos;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-size:15px;font-weight:700}.s{font-size:13px}.b{font-weight:700}.mut{fill:#5b5b5b}.ink{fill:none}.ink,.tick{stroke:#111;stroke-width:2}</style><rect width="640" height="220" fill="#FFF8E7"/><text x="40" y="32" class="t h">Orders DB</text><text x="124" y="32" class="m s mut">capacity 2k rps</text><rect width="560" height="30" x="43" y="59" fill="#111" rx="4"/><rect width="560" height="30" x="40" y="56" fill="#FFF" rx="4"/><rect width="156" height="30" x="404" y="56" fill="#FFE3EF"/><rect width="40" height="30" x="560" y="56" fill="#FFD0CC"/><rect width="312" height="30" x="40" y="56" fill="#111" rx="4"/><rect width="560" height="30" x="40" y="56" class="ink" rx="4"/><line x1="404" x2="404" y1="48" y2="94" class="tick"/><line x1="560" x2="560" y1="48" y2="94" class="tick" style="stroke:#d32f2f"/><text x="196" y="76" class="m s b" text-anchor="middle" style="fill:#fff8e7">sent 1.2k rps</text><text x="482" y="76" class="t s b" text-anchor="middle" style="fill:#c2185b">hot</text><text x="580" y="76" class="t s b" text-anchor="middle" style="fill:#d32f2f">✕</text><text x="40" y="112" class="m s mut">0</text><text x="404" y="112" class="m s mut" text-anchor="middle">1.4k (70%)</text><text x="560" y="112" class="m s mut" text-anchor="middle">2k (100%)</text><line x1="352" x2="352" y1="90" y2="190" stroke="#111" stroke-dasharray="4 3" stroke-width="1.5"/><path d="M352,148 L404,148" class="ink"/><path d="M404,142 L404,154" class="tick"/><text x="344" y="153" class="t s" text-anchor="end"><tspan class="b">+200 rps</tspan> before it runs hot</text><path d="M352,184 L560,18